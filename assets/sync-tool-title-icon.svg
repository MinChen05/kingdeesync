<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Sync Tool Title Icon</title>
  <desc id="desc">A compact circular sync mark for a desktop app title bar.</desc>
  <defs>
    <linearGradient id="bg" x1="34" y1="24" x2="222" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#126D7A"/>
      <stop offset="0.56" stop-color="#164D80"/>
      <stop offset="1" stop-color="#2D385F"/>
    </linearGradient>
    <linearGradient id="sync" x1="60" y1="52" x2="204" y2="202" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#25D6B4"/>
      <stop offset="0.64" stop-color="#60E29B"/>
      <stop offset="1" stop-color="#F1D568"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#06172B" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="18" y="18" width="220" height="220" rx="58" fill="url(#bg)"/>
  <circle cx="65" cy="62" r="44" fill="#31D9C0" opacity="0.18"/>
  <circle cx="210" cy="207" r="58" fill="#8AA3FF" opacity="0.16"/>

  <g filter="url(#shadow)">
    <path d="M66 119C77 78 120 54 160 69C178 76 193 89 202 106" fill="none" stroke="url(#sync)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M202 106L211 69L235 98" fill="none" stroke="#67E3A1" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M190 137C179 178 136 202 96 187C78 180 63 167 54 150" fill="none" stroke="url(#sync)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M54 150L45 187L21 158" fill="none" stroke="#25D6B4" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#F7FCFD" opacity="0.96">
    <rect x="79" y="113" width="27" height="27" rx="8"/>
    <rect x="115" y="113" width="27" height="27" rx="8"/>
    <rect x="151" y="113" width="27" height="27" rx="8"/>
  </g>
</svg>
