[KINGDEE]
login_url = https://your-domain/k3cloud/Kingdee.BOS.WebApi.ServicesStub.AuthService.ValidateUser.common.kdsvc
query_url = https://your-domain/k3cloud/Kingdee.BOS.WebApi.ServicesStub.DynamicFormService.ExecuteBillQuery.common.kdsvc
acct_id = your_acct_id
username = your_username
password = your_password
lcid = 2052
pagination_enabled = false
request_timeout = 0
page_size = 50000
max_pages = 100000
rate_limit_qps = 10
keep_session_alive = true
keep_alive_interval_secs = 600
auto_logout_on_exit = false

[DATABASE]
type = sqlserver

[MYSQL]
host = 127.0.0.1
user = your_user
password = your_password
database = your_database
charset = utf8mb4
port = 3306
batch_size = 5000
commit_every_n_batches = 2

[SQLSERVER]
host = 127.0.0.1
user = sa
password = your_password
database = your_database
port = 1433
driver = ODBC Driver 18 for SQL Server
dsn =
trusted_connection = false
encrypt = auto
trust_server_certificate = true
login_timeout = 15
insert_threads = 8
batch_size = 50000
commit_every_n_batches = 0
use_staging = true
force_staging_tables = saleorder,sal_outstock,sal_returnstock,sal_deliverynotice,pln_forecast,prd_instock,prd_mo,prd_moentry,prd_ppbom,prd_ppbomentry,eng_bom,eng_bomchild,stk_inventory,pur_purchaseorder,stk_instock,sub_subreqorder,bd_material
fast_executemany_tables = bd_material
stage_index_threshold = 30000
stage_index_max_columns = 3

[SYNC]
auto_sync = False
sync_interval = 120
last_sync_time =
# sync_type 可选值:
# - incremental: 增量同步（只同步最近 time_window_days 天的数据）
# - complete: 完全同步（从 full_start_date 开始同步所有数据）
sync_type = incremental
default_forms =
fetch_concurrency = 4
table_concurrency = 8
time_window_days = 30
full_start_date = 2000-01-01
timeout = 60

[INCREMENTAL_FIELDS]
# 可按目标表配置增量时间字段；未配置时程序会按字段映射/常见字段推断。
# bd_material = FMODIFYDATE
# saleorder = FModifyDate

[GUI]
theme = blue
window_width = 1200
window_height = 800
