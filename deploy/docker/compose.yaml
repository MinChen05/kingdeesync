# 参考用：实际的部署使用 Podman Pod 模式（deploy/scripts/build-and-run.sh），
# 以消除 DNS 解析依赖。此文件保留用于文档参考和 docker compose 兼容性。
services:
  kingdee-sync-api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: kingdee-sync-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      LISTEN_ADDR: 0.0.0.0
      LISTEN_PORT: "8000"
      GORM_DB_PATH: /app/state/go_state.db
    volumes:
      - ../../config.local.ini:/app/config.local.ini:ro,Z
      - ../../packages/sync-config:/app/packages/sync-config:ro,Z
      - ../../.run/logs:/app/logs:Z
      - ../../.run/state:/app/state:Z
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  kingdee-sync-web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    container_name: kingdee-sync-web
    restart: unless-stopped
    depends_on: [kingdee-sync-api]
    ports:
      - "8001:80"

networks:
  kingdee-sync-net:
    driver: bridge