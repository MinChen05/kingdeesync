services:
  kingdee-sync-api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: kingdee-sync-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      LISTEN_ADDR: 0.0.0.0
      LISTEN_PORT: "8000"
      # SQLite 状态库指向持久卷，容器重建不丢同步历史/调度配置
      # （原因：之前 go_state.db 在容器内，重建即清空全部历史记录）
      GORM_DB_PATH: /app/state/go_state.db
    volumes:
      # 相对路径基于 compose 文件所在目录（deploy/docker/），上溯到仓库根
      - ../../config.local.ini:/app/config.local.ini:ro,Z
      - ../../packages/sync-config:/app/packages/sync-config:ro,Z
      - ../../.run/logs:/app/logs:Z
      - ../../.run/state:/app/state:Z
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [kingdee-sync-net]

  kingdee-sync-web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    container_name: kingdee-sync-web
    restart: unless-stopped
    depends_on: [kingdee-sync-api]
    ports:
      - "8001:80"
    networks: [kingdee-sync-net]

networks:
  kingdee-sync-net:
    driver: bridge
