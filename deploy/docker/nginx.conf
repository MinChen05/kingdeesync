server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 共享 Pod 网络命名空间，后端在 127.0.0.1:8000，无需 DNS 解析。
    # （原因：Podman Pod 内所有容器共享网络栈，127.0.0.1 永远可达）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
    }
    location = /ready {
        proxy_pass http://127.0.0.1:8000/ready;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri /index.html$is_args$args;
    }

    # Serve debug script that logs React error details
    location /__debug.js {
        default_type application/javascript;
        return 200 'window.addEventListener("error", function(e){var err=e.error;if(err&&err.digest){console.error("[React Error]",err.digest);}});window.addEventListener("unhandledrejection",function(e){console.error("[Unhandled]",e.reason&&e.reason.digest?e.reason.digest:e.reason);});console.log("[Debug] Error logger injected");';
    }
}