server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 容器内置 DNS。用变量 + resolver 强制运行时解析容器名，
    # 避免 Nginx 启动时缓存后端 IP，后端重启换 IP 后仍指向旧地址导致 502。
    # __DNS_SERVER__ 由 web-entrypoint.sh 启动时从 /etc/resolv.conf 注入。
    resolver __DNS_SERVER__ valid=10s ipv6=off;

    location /api/ {
        set $backend http://kingdee-sync-api:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        set $backend http://kingdee-sync-api:8000/health;
        proxy_pass $backend;
    }
    location = /ready {
        set $backend http://kingdee-sync-api:8000/ready;
        proxy_pass $backend;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri /index.html$is_args$args;
    }

    # Serve debug script that logs React error details
    location /__debug.js {
        default_type application/javascript;
        return 200 'window.addEventListener("error", function(e){var err=e.error;if(err&&err.digest){console.error("[React Error]",err.digest);}});window.addEventListener("unhandledrejection",function(e){console.error("[Unhandled]",e.reason&&e.reason.digest?e.reason.digest:e.reason);});console.log("[Debug] Error logger injected");';
    }
}
