server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://kingdee-sync-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health { proxy_pass http://kingdee-sync-api:8000/health; }
    location = /ready { proxy_pass http://kingdee-sync-api:8000/ready; }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri /index.html$is_args$args;
    }

    # Serve debug script that logs React error details
    location /__debug.js {
        default_type application/javascript;
        return 200 'window.addEventListener("error", function(e){var err=e.error;if(err&&err.digest){console.error("[React Error]",err.digest);}});window.addEventListener("unhandledrejection",function(e){console.error("[Unhandled]",e.reason&&e.reason.digest?e.reason.digest:e.reason);});console.log("[Debug] Error logger injected");';
    }
}
