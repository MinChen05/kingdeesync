[KINGDEE]
login_url = https://example.invalid/k3cloud/login
query_url = https://example.invalid/k3cloud/query
acct_id = your_account_id
username = your_username
password = your_password
lcid = 2052
page_size = 10000
max_pages = 100000
rate_limit_qps = 50

[DATABASE]
type = mysql

[MYSQL]
host = doris.example.invalid
port = 9030
user = your_user
password = your_password
database = kingdee_sync
charset = utf8mb4

[SYNC]
table_concurrency = 8
sync_type = incremental
; 看门狗超时按同步类型分开（分钟）：全量与增量耗时差距约 20 倍，需分别设置
full_run_timeout_minutes = 240
incremental_run_timeout_minutes = 30
; 单表单预算（分钟）：限制一张表最多占用多久，避免一张卡死的表吃光整轮预算
; （缺省为 10；2026-11-02 事故中即时库存独占 1800 秒，连带 15 张表未执行）
form_run_timeout_minutes = 10
; 按表单覆盖的单表预算，格式 "表单名=分钟,表单名=分钟"：历史过千万的大单据
; 与万行小表共用一个预算时只能按最大者放宽，小表卡死又失去保护；按键覆盖两头兼顾
; （缺省为空 = 全部走全局值；非法条目被忽略，不影响其余条目生效）
form_run_timeout_overrides = 生产用料清单明细表=180
; 目标库内存授予排队阈值（秒）：排队超过该时长则跳过本轮并通知（填 -1 关闭）
; （原因：授予队列按 FIFO 放行，外部报表作业霸占队首时本轮注定超时，
;  见 docs/superpowers/reports/2026-11-02-target-db-memory-grant-starvation.md）
grant_wait_guard_seconds = 60

[SERVER]
host = 127.0.0.1
port = 8080
cors_origin = http://localhost:8000
