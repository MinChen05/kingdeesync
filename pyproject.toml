[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "dist",
    "build",
    "logs",
    "log",
    ".venv",
    "__pycache__",
    "docs",
    "assets",
    "checkpoints",
    "tdesign-vue-next-starter",
    "_ui_ref",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "PIE", "RET"]
ignore = ["E501", "F401", "W291", "N802", "N803", "N806", "UP035", "RET504"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401"]
"scripts/*" = ["E402", "F401"]
"check_*.py" = ["E402", "F401", "W291", "W293"]
"get_*.py" = ["E402", "F401", "W291", "W293"]
"src/gui/kingdee_sync_gui.py" = ["E402"]
"src/utils/crypto_util.py" = ["E741"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
files = [
    "main.py",
    "src/config",
    "src/services/sync_service.py",
    "src/services/settings_service.py",
    "src/services/reporting.py",
    "src/core/filter_builder.py",
    "src/core/form_sync_runner.py",
    "src/core/sync_log_repository.py",
    "src/core/sync_run_repository.py",
    "src/core/upsert_engine_mysql.py",
    "src/core/upsert_engine_sqlserver.py",
    "src/core/writers_registry.py",
    "src/gui/workers.py",
    "src/gui/pages/settings_page.py",
    "src/utils/logger.py",
]
exclude = "^(dist|build|logs|log|\\.venv|docs|assets)/"
